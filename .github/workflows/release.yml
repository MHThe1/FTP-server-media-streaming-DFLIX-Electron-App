name: Build and Release

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: windows-latest
    environment: .env  # Required to access environment-scoped variables

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Electron app
        run: npm run electron:build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_CONFIG_API_URL: ${{ vars.VITE_CONFIG_API_URL }}
          VITE_TMDB_API_KEY: ${{ vars.VITE_TMDB_API_KEY }}
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}
          VITE_GA_API_SECRET: ${{ secrets.VITE_GA_API_SECRET }}

      - name: Upload installer to release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist-electron-build/BetterFlix Setup *.exe
            dist-electron-build/*.blockmap
            dist-electron-build/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
