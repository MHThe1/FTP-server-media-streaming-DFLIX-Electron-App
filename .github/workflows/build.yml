name: Build & Release

on:
  push:
    tags:
      - 'v*' # Trigger on tags like v1.0.0

permissions:
  contents: write
  packages: write
  issues: write

jobs:
  build:
    name: Build (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Build & Publish Electron App
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # These secrets must be added in GitHub Settings > Secrets > Actions
          VITE_TMDB_API_KEY: ${{ secrets.VITE_TMDB_API_KEY }} 
          VITE_HTTP_SERVER_URL: ${{ vars.VITE_HTTP_SERVER_URL || 'http://cdn.dflix.live' }}
          # Backend config API for trending/announcements
          VITE_CONFIG_API_URL: ${{ vars.VITE_CONFIG_API_URL }}
          # Google Analytics 4
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}
          VITE_GA_API_SECRET: ${{ secrets.VITE_GA_API_SECRET }}
        run: npm run electron:build
