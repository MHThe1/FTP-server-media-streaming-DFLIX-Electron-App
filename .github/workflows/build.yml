name: Build & Release

on:
  push:
    tags:
      - 'v*' # Trigger on tags like v1.0.0

permissions:
  contents: write
  packages: write
  issues: write

jobs:
  build:
    name: Build (.exe)
    runs-on: windows-latest
    environment: .env  # Required to access environment-scoped variables

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Build & Publish Electron App
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Environment variables (set in GitHub Settings > Environments > production)
          VITE_TMDB_API_KEY: ${{ vars.VITE_TMDB_API_KEY }}
          VITE_HTTP_SERVER_URL: ${{ vars.VITE_HTTP_SERVER_URL || 'http://cdn.dflix.live' }}
          VITE_CONFIG_API_URL: ${{ vars.VITE_CONFIG_API_URL }}
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}
          VITE_GA_API_SECRET: ${{ secrets.VITE_GA_API_SECRET }}
        run: npm run electron:build

